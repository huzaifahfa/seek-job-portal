<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title></title>
</head>
<body>
<div class="header-container">
    <h2>SEEK Job Application Portal</h2>
    <p>This portal allows users to apply for jobs and manage job listings.</p>
</div>
<div class="container-sm">
    <div class="card-body" align="center">
        <!--Form for Dropdown Box with Two Choices: Admin or Candidate -->
        <form action="/" method="POST">
            <select name="role" id="role">
                <option value="" disabled selected>Choose Your Role</option>
                <option value="admin">Admin</option>
                <option value="candidate">Candidate</option>
            </select>
            <div class="card-body" align="center">
                <input type="submit" value="Go!" class="btn btn-success" role="button">
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</body>

<!--Styling Choices for the Main Webpage Website :3-->
<style>
    body{
        background-color: aliceblue;
    }
    .header-container{
        height: 100px;
        border: 5px solid navy;
        background-color: ghostwhite;
        padding: 5px;
    }
    .header-container h2{
        font-family: Arial, serif;
        font-size: 2.5rem;
        font-style: italic;
        margin: 0;
    }
    .header-container p{
        font-family: Arial, serif;
        font-style: bold;
        color: navy;
    }
    .banner-container{
        height:250px;
        background-color: cornflowerblue;
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .banner-container h1{
        font-family: Garamond, serif;
        font-size: 3rem;
        color: white;
    }
</style>

</html>
