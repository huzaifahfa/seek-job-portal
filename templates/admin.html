<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>{{ 'Edit Job' if job else 'Admin Dashboard' }}Admin Dashboard</title>
</head>
<body>
<div class="container-sm mt-4">
    {% if not job %}
    <a href="/" class="btn btn-outline-primary mb-3">← Back to Home</a>
    <div class="card card-body bg-light mb-4 text-center">
        <form action="/admin_nav" method="POST" class="form-inline justify-content-center">
            <label for="admin_route" class="mr-2"><strong>Admin Menu:</strong></label>
            <select name="admin_route" id="admin_route" class="form-control mr-2">
                <option value="admin" selected>Create a New Job</option>
                <option value="manage">Manage Existing Jobs</option>
            </select>
            <input type="submit" value="Go!" class="btn btn-primary">
        </form>
    </div>
    {% else %}
        <a href="/job/{{ job['jid'] }}" class="btn btn-secondary mb-4">← Cancel Edit</a>
    {% endif %}

    {% if error %} <div class="alert alert-danger">{{ error }}</div> {% endif %}
    {% if success_msg %} <div class="alert alert-success">{{ success_msg }}</div> {% endif %}

    <div id="createJobsView" class="card-body">
        <h2 class="card-title">{{ 'Edit Job Listing' if job else 'Create a New Job' }}</h2>

        <form action="{{ '/job/' ~ job['jid'] ~ '/edit' if job else '/admin' }}" method="POST">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" value="{{ job['title'] if job else '' }}" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" class="form-control" name="description" rows="8" required>{{ job['description'] if job else '' }}</textarea>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" value="{{ job['location'] if job else '' }}" required>
            </div>
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if job else 'Create Job' }}</button>
        </form>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
</body>
</html>
